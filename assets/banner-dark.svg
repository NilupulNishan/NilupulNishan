<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t">
  <title id="t">Nilupul Nishan, AI Engineer</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a525c"/>
    </marker>
    <style>
      .name { font: 700 72px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: #e6edf3; letter-spacing: -1px; }
      .role { font: 600 34px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: #9d9bff; }
      .label { font: 500 17px ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; fill: #8b949e; }
      .edge { stroke: #4a525c; stroke-width: 2.5; fill: none; }
      .loop { stroke: #4a525c; stroke-width: 2.5; fill: none; stroke-dasharray: 6 7; }
      .node { fill: #161b22; stroke: #9d9bff; stroke-width: 3; }
      .node-end { fill: #9d9bff; }
    </style>
  </defs>

  <rect x="1" y="1" width="1278" height="318" rx="18" fill="#161b22" stroke="#30363d" stroke-width="2"/>

  <text class="name" x="80" y="160">Nilupul Nishan</text>
  <text class="role" x="82" y="214">AI Engineer</text>

  <!-- An agent graph: understand -> retrieve / memory -> answer, with a reflection loop -->
  <path class="edge" d="M866,160 L966,104" marker-end="url(#arrow)"/>
  <path class="edge" d="M866,160 L966,216" marker-end="url(#arrow)"/>
  <path class="edge" d="M1002,96 L1102,152" marker-end="url(#arrow)"/>
  <path class="edge" d="M1002,224 L1102,168" marker-end="url(#arrow)"/>
  <path class="loop" d="M1120,182 C1120,290 852,290 852,186" marker-end="url(#arrow)"/>

  <circle class="node" cx="852" cy="160" r="15"/>
  <circle class="node" cx="984" cy="94" r="15"/>
  <circle class="node" cx="984" cy="226" r="15"/>
  <circle class="node node-end" cx="1120" cy="160" r="15"/>

  <text class="label" x="852" y="128" text-anchor="middle">understand</text>
  <text class="label" x="984" y="62" text-anchor="middle">retrieve</text>
  <text class="label" x="1046" y="232" text-anchor="start">memory</text>
  <text class="label" x="1120" y="128" text-anchor="middle">answer</text>
  <text class="label" x="986" y="286" text-anchor="middle">reflect</text>
</svg>
